<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Hướng Nghiệp | Trắc nghiệm năng lực & định hướng nghề nghiệp</title>
    <meta
      name="description"
      content="Trắc nghiệm năng lực, thư viện ngành nghề và gợi ý chọn trường — đồng hành cùng bạn trên hành trình định hướng nghề nghiệp, giúp bạn hiểu rõ bản thân và chọn hướng đi phù hợp."
    />
    <meta
      name="keywords"
      content="hướng nghiệp, trắc nghiệm hướng nghiệp, định hướng nghề nghiệp, chọn ngành, chọn trường, trắc nghiệm năng lực, tư vấn nghề nghiệp, ngành nghề"
    />
    <meta name="author" content="Hướng Nghiệp" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="Vietnamese" />
    <meta name="revisit-after" content="7 days" />
    <link rel="canonical" href="https://huongnghiep.vn/" />

    <!-- Theme & icons -->
    <meta name="theme-color" content="#0b5fff" />
    <meta name="msapplication-TileColor" content="#0b5fff" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/logos/logo-mark.svg" />

    <!-- Open Graph (Facebook, Zalo, LinkedIn…) -->

    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Hướng Nghiệp" />
    <meta property="og:title" content="Hướng Nghiệp | Trắc nghiệm năng lực & định hướng nghề nghiệp" />

      property="og:description"
      content="Trắc nghiệm năng lực, thư viện ngành nghề và gợi ý chọn trường phù hợp với bạn."
    />
    <meta property="og:url" content="https://huongnghiep.vn/" />
    <meta property="og:image" content="https://huongnghiep.vn/images/banners/banner-1.jpg" />
    <meta property="og:image:alt" content="Hướng Nghiệp — định hướng nghề nghiệp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hướng Nghiệp | Trắc nghiệm năng lực & định hướng nghề nghiệp" />

      name="twitter:description"
      content="Trắc nghiệm năng lực, thư viện ngành nghề và gợi ý chọn trường phù hợp với bạn."

    <meta name="twitter:image:alt" content="Hướng Nghiệp — định hướng nghề nghiệp" />

    <!-- Ads / Verification (điền ID thật khi có) -->
    <!-- Google Search Console -->
    <meta name="google-site-verification" content="YOUR_GOOGLE_SITE_VERIFICATION_CODE" />
    <!-- Google Ads / AdSense -->
    <meta name="google-adsense-account" content="ca-pub-XXXXXXXXXXXXXXXX" />
    <!-- Facebook Domain Verification -->
    <meta name="facebook-domain-verification" content="YOUR_FACEBOOK_DOMAIN_VERIFICATION_CODE" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Hướng Nghiệp",
        "url": "https://huongnghiep.vn/",
        "description": "Trắc nghiệm năng lực, thư viện ngành nghề và gợi ý chọn trường — đồng hành định hướng nghề nghiệp.",
        "inLanguage": "vi-VN",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://huongnghiep.vn/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
